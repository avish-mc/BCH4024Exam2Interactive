<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why did that happen? Metabolism logic drills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --bg:#0c2a52; --bg2:#09203f;
  --line:rgba(214,232,255,.2); --line2:rgba(214,232,255,.55);
  --ink:#eef5ff; --dim:#a9c2e6;
  --yel:#ffd23f; --cy:#72d6ff; --ok:#62e2ae; --bad:#ff6f5a;
  --disp:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html{background:var(--bg)}
body{
  margin:0;color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(214,232,255,.14) 1px,transparent 1px),
    linear-gradient(90deg,rgba(214,232,255,.14) 1px,transparent 1px),
    linear-gradient(rgba(214,232,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(214,232,255,.05) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px}

.shell{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1180px;margin:0 auto;min-height:100vh}
.rail{border-right:1px solid var(--line2);padding:28px 22px;display:flex;flex-direction:column;gap:26px;background:rgba(9,32,63,.72)}
.nav{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.nav button{background:none;border:0;border-bottom:1px solid var(--line);text-align:left;padding:12px 4px 12px 14px;cursor:pointer;position:relative}
.nav button b{display:block;font-family:var(--disp);font-size:24px;font-weight:700;letter-spacing:.02em}
.nav button span{display:block;color:var(--dim);font-size:14px;line-height:1.3}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:rgba(255,210,63,.1)}
.nav button.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--yel)}
.fb{margin-top:auto}
.fb p{margin:0 0 8px;font-size:14px;color:var(--dim)}
.seg{display:flex;border:1px solid var(--line2)}
.seg button{flex:1;background:none;border:0;padding:8px 6px;cursor:pointer;font-size:14px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--ink);color:var(--bg2);font-weight:700}

main{padding:28px 26px 60px;min-width:0}
.sheet{position:relative;border:1px solid var(--line2);background:rgba(9,32,63,.78);padding:30px clamp(16px,3.5vw,38px) 22px}
.sheet::before,.sheet::after{content:"";position:absolute;width:16px;height:16px;border:3px solid var(--yel)}
.sheet::before{left:-3px;top:-3px;border-right:0;border-bottom:0}
.sheet::after{right:-3px;bottom:-3px;border-left:0;border-top:0}

h3.q{font-family:var(--body);font-weight:700;font-size:clamp(19px,2.4vw,23px);line-height:1.35;margin:6px 0 18px}
.lede{color:var(--dim);margin:0 0 22px;max-width:62ch}
.tag{color:var(--yel);font-size:15px;font-weight:700;margin:0 0 4px}

.list{border-top:1px solid var(--line2)}
.list button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line2);padding:16px 10px 16px 18px;cursor:pointer;position:relative}
.list button b{display:block;font-family:var(--disp);font-size:28px;font-weight:700;letter-spacing:.02em;line-height:1.1}
.list button span{color:var(--dim);font-size:16px}
.list button:hover{background:rgba(255,210,63,.1)}
.list button:hover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--yel)}

.ticks{display:flex;align-items:center;gap:4px;margin-bottom:20px;flex-wrap:wrap}
.ticks::before,.ticks::after{content:"";width:2px;height:16px;background:var(--line2)}
.tick{flex:1;height:6px;border:1px solid var(--line2);max-width:44px;min-width:14px}
.tick.cur{background:var(--yel);border-color:var(--yel)}
.tick.done{background:var(--ink);border-color:var(--ink)}
.tick.ok{background:var(--ok);border-color:var(--ok)}
.tick.bad{background:var(--bad);border-color:var(--bad)}

.ribbon{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:20px;font-size:14px}
.ribbon .s{border:1px solid var(--line2);background:var(--bg2);padding:3px 10px}
.ribbon .s i{font-style:normal;color:var(--yel);font-weight:700;margin-right:6px}
.ribbon .ar{color:var(--dim)}

.case{border:1px solid var(--line2);margin:0 0 20px;background:rgba(255,255,255,.04)}
.case>summary{cursor:pointer;padding:9px 14px;font-weight:700;list-style:none;display:block}
.case>summary::-webkit-details-marker{display:none}
.case>summary::before{content:"+ ";color:var(--yel)}
.case[open]>summary::before{content:"- "}
.case .inner{padding:0 14px 14px}
.case .exam{margin:4px 0 12px}
.case .chips{margin:0}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 20px}
.chip{border:1px solid var(--line2);background:var(--bg2);padding:5px 12px;font-size:16px;text-align:left}
.chip b{font-family:var(--disp);font-size:26px;margin-left:8px;color:var(--yel);vertical-align:-2px}
.chip.dn b{color:var(--cy)}
.chip.eq b{font-family:var(--body);font-size:15px;color:var(--dim);vertical-align:0}
button.chip{cursor:pointer}
button.chip:hover:not(:disabled){background:rgba(255,255,255,.1)}
button.chip:disabled{cursor:default}
.chip.on{background:var(--ink);color:var(--bg2);border-color:var(--ink)}
.chip.on b{color:var(--bg2)}
.chip.ok{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.chip.bad{border-color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad);text-decoration:line-through}
.chip.miss{border:2px dashed var(--yel)}
.exam{background:#f1f5fb;color:#13203a;padding:16px 20px;font-size:16px;line-height:1.5;white-space:pre-wrap;margin:6px 0 20px;border-left:6px solid var(--dim)}

.opts{border-bottom:1px solid var(--line)}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:13px 8px;cursor:pointer}
.opt:hover:not(:disabled){background:rgba(255,255,255,.07)}
.opt:disabled{cursor:default}
.bub{flex:0 0 auto;width:30px;height:30px;border:1.5px solid var(--line2);border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;margin-top:-1px}
.opt.sel .bub{background:var(--ink);color:var(--bg2);border-color:var(--ink)}
.opt.ok .bub{background:var(--ok);border-color:var(--ok);color:#06241a}
.opt.bad .bub{background:var(--bad);border-color:var(--bad);color:#2a0804}
.opt.miss .bub{border:2px dashed var(--yel);color:var(--yel)}
.opt.ok .t{box-shadow:inset 0 -.45em rgba(98,226,174,.28)}
.opt.bad .tx{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:2px;color:var(--dim)}
.rs{display:block;margin-top:4px;font-size:15px;line-height:1.4;color:var(--dim)}
.opt.ok .rs{color:var(--ok)}
.opt.bad .rs{color:#ffb3a8}
.opt.miss .rs{color:var(--yel)}

.note{margin-top:22px;border:1px solid var(--line2);border-left:6px solid var(--ok);background:rgba(255,255,255,.05);padding:14px 18px}
.note.bad{border-left-color:var(--bad)}
.note h4{margin:0 0 4px;font-family:var(--disp);font-size:24px;font-weight:700;letter-spacing:.02em}
.note p{margin:0 0 6px}
.note small{color:var(--dim);font-size:15px}

.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;align-items:center}
.btn{background:var(--yel);color:#1b1500;border:0;padding:12px 24px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line2)}
.warn{color:var(--yel);font-size:15px}

.chain{display:flex;flex-wrap:wrap;gap:16px 0;align-items:stretch;margin:12px 0 22px}
.node{min-width:94px;max-width:136px;padding:8px 8px 4px;border:1.5px solid var(--ink);text-align:center;cursor:pointer;background:var(--bg2);font-size:15px;line-height:1.2;user-select:none;display:flex;flex-direction:column;justify-content:space-between}
.node:hover{background:rgba(255,255,255,.1)}
.node .mk{font-family:var(--disp);font-size:34px;font-weight:800;line-height:1.1;min-height:38px;color:var(--dim)}
.node .mk small{display:block;font-family:var(--body);font-size:12px;font-weight:700;line-height:1.1;color:var(--ink)}
.node.up .mk{color:var(--yel)}
.node.dn .mk{color:var(--cy)}
.node.ok{border-color:var(--ok)}
.node.bad{border-color:var(--bad)}
.node.locked{cursor:default}
.link{flex:1 1 60px;min-width:60px;max-width:116px;text-align:center;font-size:12px;line-height:1.15;color:var(--dim);align-self:center;padding:0 3px}
.link i{display:block;height:2px;background:var(--ink);margin-top:4px;position:relative}
.link i::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:9px solid var(--ink);border-right:0}
.link.blocked{color:var(--yel);font-weight:700}
.link.blocked i{background:repeating-linear-gradient(90deg,var(--yel) 0 6px,transparent 6px 10px)}
.link.blocked i::after{border-left-color:var(--yel)}
.link .stamp{display:inline-block;margin-top:5px;border:1.5px solid var(--yel);padding:0 6px;font-style:normal;font-weight:700;font-size:12px}
.sub2{font-size:15px;color:var(--dim);margin:18px 0 8px}
.extras{display:flex;flex-wrap:wrap;gap:10px}
.pile{background:none;border:1.5px solid var(--line2);padding:6px 12px;cursor:pointer;font-size:15px}
.pile:hover:not(:disabled){background:rgba(255,255,255,.08)}
.pile.on{background:var(--ink);color:var(--bg2);border-color:var(--ink);font-weight:700}
.pile.ok{background:var(--ok);border-color:var(--ok);color:#06241a;font-weight:700}
.pile.bad{background:var(--bad);border-color:var(--bad);color:#2a0804;font-weight:700}

.tblock{display:grid;grid-template-columns:repeat(4,auto);width:max-content;max-width:100%;margin:30px 0 0 auto;border:1px solid var(--line2);font-size:14px}
.tblock div{padding:5px 14px 6px;border-left:1px solid var(--line2)}
.tblock div:first-child{border-left:0}
.tblock span{display:block;color:var(--dim);font-size:12px}
.tblock b{font-weight:700}

.score{font-family:var(--disp);font-weight:800;font-size:clamp(72px,12vw,120px);line-height:.9;margin:6px 0 4px}
.score small{font-size:.4em;color:var(--dim);font-weight:700}
details.r{border-top:1px solid var(--line);padding:10px 0}
details.r:last-of-type{border-bottom:1px solid var(--line)}
details.r summary{cursor:pointer;display:flex;gap:12px;align-items:baseline}
details.r summary .m{font-family:var(--disp);font-size:24px;font-weight:800;width:22px;flex:0 0 auto}
details.r summary .m.ok{color:var(--ok)}
details.r summary .m.bad{color:var(--bad)}
details.r .body{padding:8px 0 4px 34px;color:var(--ink);font-size:16px}
details.r .body p{margin:0 0 6px}
.weak{border:1px solid var(--line2);border-left:6px solid var(--yel);padding:12px 16px;margin:18px 0}
.weak b{font-family:var(--disp);font-size:22px;letter-spacing:.02em}

footer{margin-top:22px;color:var(--dim);font-size:14px;max-width:70ch}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{border-right:0;border-bottom:1px solid var(--line2);gap:16px;padding:20px 16px}
  .nav{display:grid;grid-template-columns:1fr 1fr}
  .nav button span{display:none}
  .nav button{border-right:1px solid var(--line)}
  .fb{margin-top:0}
  main{padding:18px 12px 50px}
  .tblock{grid-template-columns:repeat(2,auto)}
  .tblock div:nth-child(3){border-left:0;border-top:1px solid var(--line2)}
  .tblock div:nth-child(4){border-top:1px solid var(--line2)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <nav class="nav" id="nav">
      <button data-mode="cascade" class="on"><b>Cascade</b><span>Hormone to receptor to enzyme to result</span></button>
      <button data-mode="trace"><b>Block it</b><span>Block one enzyme, mark what piles up or runs short</span></button>
      <button data-mode="detect"><b>Find the fault</b><span>Read a case, circle the clues, answer exam style</span></button>
      <button data-mode="crit"><b>Fix the question</b><span>Spot the flaw, pick the best rewrite</span></button>
    </nav>
    <div class="fb">
      <p>Feedback for the next round</p>
      <div class="seg" id="seg">
        <button data-v="instant" class="on">After each</button>
        <button data-v="end">At the end</button>
      </div>
    </div>
  </aside>
  <main>
    <div id="app"></div>
    <footer>Practice material written for SI sessions. It is not from your professors, so check it against your own lecture slides.</footer>
  </main>
</div>

<script>
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const app = $('#app');
const arrow = d => d > 0 ? '↑' : d < 0 ? '↓' : '↔';
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const L = i => String.fromCharCode(65+i);

/* Item builders. In every builder the CORRECT option is listed first;
   options are shuffled when shown.                                   */
const S = (label,chain,tag,q,a,w,why) => ({kind:'mc',label,chain,tag,q,opts:[a,...w],why});
/* R: multiple choice where every option carries its own reason (study nugget style) */
const R = (tag,q,pairs) => ({kind:'mc',tag,q,opts:pairs.map(p=>p[0]),rs:pairs.map(p=>p[1]),why:pairs[0][1]});
/* MR: select all that apply (rows) */
const MR = (tag,q,items) => ({kind:'multi',style:'rows',tag,q,items:items.map(([t,key,why])=>({t,key,why})),allowExtra:0});
/* lab finding for case chips */
const lab = (n,v,key,why) => ({n,v,key:!!key,why});

/* ================= DATA: cascades ================= */
const SCEN = {
  fed:{ name:'Fed state', blurb:'Big carb-rich meal, blood glucose climbing. Follow insulin all the way to the liver.', steps:[
    S('Trigger','Insulin released','Hormone and receptor',
      'You just ate a big carb-rich meal and blood glucose is climbing. What does the pancreas release?',
      'Insulin from beta cells (gut GLP-1 helps boost this release)',
      ['Glucagon from alpha cells','Insulin from alpha cells','Epinephrine from the pancreas'],
      'High blood glucose makes beta cells secrete insulin. GLP-1 is a gut hormone that amplifies that release, but insulin is the hormone that acts on liver, muscle, and fat.'),
    S('Receptor','RTK autophosphorylates','Hormone and receptor',
      'What kind of receptor does insulin bind, and what does it do first?',
      'Receptor tyrosine kinase: dimerizes and autophosphorylates Tyr residues',
      ['Gs-coupled GPCR: swaps GDP for GTP and raises cAMP','Ligand-gated channel: opens and lets Na⁺ in','Nuclear receptor: travels straight to DNA'],
      'Insulin uses an RTK. The phosphorylated Tyr residues become docking sites for SH2 proteins like IRS1 and Grb2. The Gs and cAMP route belongs to glucagon and epinephrine.'),
    S('Switch','PP1 active, dephosphorylation','Kinase and phosphatase switch',
      'Which statement describes the "mode" the liver cell enters after insulin signaling?',
      'Protein phosphatase 1 (PP1) becomes active, so target enzymes get dephosphorylated',
      ['PKA becomes active, so target enzymes get phosphorylated','cAMP rises, so phosphorylase kinase turns on','Ras and ERK directly flip the metabolic enzymes'],
      'The fed state is a dephosphorylation state (insulin leads to PP1). Fasting and stress are phosphorylation states (cAMP leads to PKA). The Ras and ERK branch drives gene expression, not the metabolic switch.'),
    S('Glucose trap','Glucokinase moves to cytosol','Enzyme regulation',
      'Glucose floods into the liver. What lets glucokinase (hexokinase IV) trap it as G6P?',
      'High glucose releases it from a nuclear regulatory protein, and its high Km means it works best at high glucose',
      ['PKA phosphorylates it and switches it on','G6P activates it as a feed-forward signal','F2,6BP binds it directly and activates it'],
      'Glucokinase sits in the nucleus bound to a regulatory protein when glucose is low. High glucose frees it to move to the cytosol. F6P strengthens that binding, and G6P does not inhibit it the way it inhibits other hexokinases.'),
    S('Glycogen','Synthase ON, phosphorylase OFF','Enzyme regulation',
      'PP1 is active. What happens to the two glycogen enzymes?',
      'Glycogen synthase is dephosphorylated (ON) and glycogen phosphorylase is dephosphorylated (OFF)',
      ['Synthase is phosphorylated (OFF) and phosphorylase is phosphorylated (ON)','Both enzymes are dephosphorylated and ON','Both enzymes are phosphorylated and OFF'],
      'The two enzymes follow opposite rules. Synthase: dephosphorylated means ON. Phosphorylase: phosphorylated (the "a" form) means ON, so dephosphorylated means OFF. That keeps glycogen from being built and broken at the same time.'),
    S('Glycolysis switch','PFK-2 ON, F2,6BP up, glycolysis up','Enzyme regulation',
      'The liver bifunctional enzyme (PFK-2/FBPase-2) gets dephosphorylated. What follows?',
      'PFK-2 activity wins, F2,6BP rises, PFK-1 is activated, glycolysis ↑',
      ['FBPase-2 activity wins, F2,6BP falls, PFK-1 slows, glycolysis ↓','PFK-2 activity wins, F2,6BP rises, FBPase-1 is activated, gluconeogenesis ↑','FBPase-2 activity wins, F2,6BP rises, glycolysis ↑'],
      'Dephosphorylated, the bifunctional enzyme acts as PFK-2 and makes F2,6BP. F2,6BP activates PFK-1 and inhibits FBPase-1. Phosphorylated, it acts as FBPase-2, which goes with glucagon and gluconeogenesis.'),
    S('PDH','PDH ON','Enzyme regulation',
      'Insulin also stimulates PDP (pyruvate dehydrogenase phosphatase). What happens to the PDH complex?',
      'It is dephosphorylated and active, so pyruvate is converted to acetyl-CoA',
      ['It is phosphorylated and inactive','It does not change, because PDH is not hormonally regulated','It is active only when ATP is low and NADH is high'],
      'PDP removes the phosphate, which turns PDH ON. High NADH, acetyl-CoA, and ATP inhibit PDH, so the "ATP low and NADH high" idea is backwards.'),
    S('Net result','Blood glucose down','Putting it together',
      'Which set best describes the liver in the fed state?',
      'Glycolysis ↑, glycogen synthesis ↑, gluconeogenesis ↓, blood glucose ↓',
      ['Glycolysis ↓, glycogen breakdown ↑, gluconeogenesis ↑, blood glucose ↑','Glycolysis ↑, glycogen breakdown ↑, gluconeogenesis ↓, blood glucose ↑','Glycolysis ↓, glycogen synthesis ↑, gluconeogenesis ↑, blood glucose ↓'],
      'Every switch pointed the same way: burn and store glucose, stop making it. Check each wrong option for one flipped piece. That is how most exam distractors are built.')
  ]},
  fasted:{ name:'Fasting (glucagon)', blurb:'Hours without food, blood glucose falling. Follow glucagon through the liver.', steps:[
    S('Trigger','Glucagon released','Hormone and receptor',
      'Several hours into a fast, blood glucose is falling. Which hormone is released, and from where?',
      'Glucagon from pancreatic alpha cells',
      ['Insulin from pancreatic beta cells','Insulin from pancreatic alpha cells','Glucagon from pancreatic beta cells'],
      'Low glucose means glucagon from alpha cells. Beta cells make insulin. Two of the wrong options just swap the cell and hormone pair.'),
    S('Receptor','Gs GPCR','Hormone and receptor',
      'What kind of receptor does glucagon bind in the hepatocyte?',
      'Gs-coupled GPCR',
      ['Receptor tyrosine kinase','Gi-coupled GPCR','Ligand-gated ion channel'],
      'Glucagon uses a Gs-coupled GPCR (as does epinephrine at the beta-adrenergic receptor). RTKs are the insulin side.'),
    S('Messenger','cAMP up, PKA active','Kinase and phosphatase switch',
      'Which order of events is correct after glucagon binds?',
      'G protein swaps GDP for GTP, adenylyl cyclase is stimulated, cAMP rises, PKA is activated',
      ['Receptor dimerizes, IRS1 is phosphorylated, Ras is activated, ERK is activated','GTP phosphorylates the G protein, phospholipase C is activated, IP3 rises','PKA is activated first, then cAMP rises, then adenylyl cyclase turns on'],
      'GPCR activation is a nucleotide exchange (GDP out, GTP in), not a phosphorylation. The cascade runs G protein, adenylyl cyclase, cAMP, PKA.'),
    S('Glycogen','Phosphorylase ON, synthase OFF','Enzyme regulation',
      'PKA (through phosphorylase kinase) phosphorylates the glycogen enzymes. What is the result?',
      'Glycogen phosphorylase becomes active and glycogen synthase becomes inactive',
      ['Glycogen phosphorylase becomes inactive and glycogen synthase becomes active','Both enzymes become active','Both enzymes become inactive'],
      'Phosphorylated phosphorylase (the "a" form) is ON. Phosphorylated synthase is OFF. Breakdown goes up while synthesis shuts down.'),
    S('Glycolysis switch','FBPase-2 ON, F2,6BP down','Enzyme regulation',
      'PKA phosphorylates the bifunctional enzyme. What follows?',
      'FBPase-2 activity wins, F2,6BP falls, PFK-1 loses its activator, glycolysis ↓ and gluconeogenesis ↑',
      ['PFK-2 activity wins, F2,6BP rises, glycolysis ↑','FBPase-2 activity wins, F2,6BP rises, gluconeogenesis ↓','Nothing, because the bifunctional enzyme is not regulated by phosphorylation'],
      'Phosphorylation switches the enzyme to FBPase-2, which breaks F2,6BP back down to F6P. With less F2,6BP, PFK-1 slows and FBPase-1 is released from inhibition.'),
    S('Pyruvate kinase','Liver PK phosphorylated, OFF','Enzyme regulation',
      'PKA also acts on liver pyruvate kinase. What happens, and why does it make sense?',
      'It is phosphorylated and inactivated, so PEP is not burned back to pyruvate while the liver is making glucose',
      ['It is phosphorylated and activated to make more ATP','F1,6BP inhibits it as feedback','Insulin activates it, and that wins during fasting'],
      'PKA phosphorylation turns liver PK OFF. F1,6BP normally activates PK (a feed-forward signal), and insulin is low in a fast. Turning PK off stops PEP from cycling back to pyruvate, which would waste energy against PEPCK.'),
    S('Glucokinase','Glucokinase held in nucleus','Enzyme regulation',
      'Why is glucokinase (hexokinase IV) inactive during fasting?',
      'Low glucose lets a regulatory protein hold it in the nucleus',
      ['G6P inhibits it','PKA phosphorylates it','It is degraded by the proteasome'],
      'Glucokinase is not inhibited by G6P. It is sequestered in the nucleus by a regulatory protein when glucose is low and released when glucose rises.'),
    S('Exit','Glucose leaves the liver','Pathway output',
      'The liver is making glucose 6-phosphate from glycogen and from gluconeogenesis. What lets free glucose leave the cell?',
      'Glucose 6-phosphatase removes the phosphate (it sits in the ER lumen of liver and kidney cells)',
      ['Hexokinase removes the phosphate','PEPCK removes the phosphate','Glucokinase removes the phosphate'],
      'Both glycogen breakdown and gluconeogenesis end at G6P, and G6Pase is the shared last step. Hexokinase and glucokinase go the other way, adding phosphate.'),

function buildCase(c){
  const items = [];
  if(!c.noClue){
    items.push({kind:'multi', style:'chips', clue:true, caseRef:c, tag:'Circle the clues',
      q:'Tap the findings that point most directly to the broken step. These are the ones you would circle in the vignette.',
      items:c.labs.map(l => ({t:l.n, v:l.v, key:l.key, why:l.why})), allowExtra:1});
  }
  c.qs.forEach(q => items.push({...q, caseRef:c}));
  return items;
}

   fixes:['Add findings that separate the choices (for example, enlarged liver, high lactate, high liver glycogen, and high liver G6P)','Change "most likely" to "definitely"','Add the word "hypoglycemic" to the stem'],
   why1:'Every one of these enzymes lowers fasting glucose when it fails, so the stem gives no way to choose between them.',
   why2:'Adding findings that point to one enzyme (here, the shared last step) lets students reason instead of guess. Rewording the stem adds no new information.' },
 { flaw:3,
   exam:'Which cofactor does pyruvate carboxylase, the first gluconeogenesis bypass enzyme, require?\n\nA. Biotin\nB. TPP\nC. Lipoic acid\nD. FAD\n\nAnswer key: B',
   fixes:['Change the key to A, because pyruvate carboxylase uses biotin and TPP is the cofactor of PDH E1','Keep the key and add "in the PDH complex" to the stem','Delete option A so only one option is left that sounds right'],
   why1:'The key is wrong. Pyruvate carboxylase is a biotin enzyme (with ATP and bicarbonate). TPP belongs to PDH E1.',
   why2:'Fix the key. Rewriting the stem to "in the PDH complex" would make TPP, lipoic acid, and FAD all correct, and deleting biotin would leave a question with no correct answer.' },
 { flaw:4,
   exam:'A patient has low activity of the E3 subunit of the PDH complex. Which of the following best explains the high lactate?\n\nA. Impaired PDH complex function\nB. Increased gluconeogenesis\nC. Increased fatty acid oxidation\nD. Decreased glycolytic flux',
   fixes:['List the findings (high lactate, pyruvate, and alanine, low ketones, urine lipoic acid derivatives) and drop the named subunit, with options of similar wording','Move the correct answer to position D','Add "All of the above" as option E'],
   why1:'The stem names the PDH complex and option A repeats it, so students can match words without any reasoning.',
   why2:'Describe the findings and let students infer the defect. Moving the answer or adding "All of the above" leaves the word match intact.' }
];

/* ================= state ================= */
let mode = 'cascade';
let exam = false;      // feedback at the end
let run = null;

/* ================= nav / settings ================= */
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  mode = b.dataset.mode; run = null;
  document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x === b));
  menu();
});
$('#seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  exam = b.dataset.v === 'end';
  document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b));
});

/* ================= menus ================= */
function menu(){
  let h = '<div class="sheet">';
  if(mode === 'cascade'){
    h += `<p class="lede">Pick a situation. At each step, choose what the body does next.</p><div class="list">`;
    for(const k in SCEN) h += `<button data-act="scen" data-id="${k}"><b>${SCEN[k].name}</b><span>${SCEN[k].blurb}</span></button>`;
    h += '</div>';
  } else if(mode === 'trace'){
    h += `<p class="lede">An enzyme gets blocked. Click each box to mark what piles up (↑) or runs short (↓), then pick the biggest pile-up. Some blocks add a question about how the cell copes.</p><div class="list">`;
    h += `<button data-act="trace" data-id="mix"><b>Mixed round</b><span>Five random blocks from every pathway.</span></button>`;
    PATHS.forEach(p => h += `<button data-act="trace" data-id="${p.id}"><b>${p.name}</b><span>${p.blurb}</span></button>`);
    h += '</div>';
  } else if(mode === 'detect'){
    h += `<p class="lede">Read the case, circle the clues, then answer the way the exam asks. Every option explains why it is right or wrong.</p><div class="list">`;
    h += `<button data-act="case" data-id="rand"><b>Random case</b><span>One case picked for you.</span></button>`;
    CASES.forEach(c => { const n = buildCase(c).length; h += `<button data-act="case" data-id="${c.id}"><b>${c.title}</b><span>${n} steps</span></button>`; });
    h += '</div>';
  } else {
    h += `<p class="lede">Each practice question has a flaw. First name the flaw, then choose the rewrite that fixes it.</p><div class="list">
      <button data-act="crit"><b>Start a round</b><span>${CRIT.length} flawed questions, two steps each.</span></button></div>`;
  }
  h += '</div>';
  app.innerHTML = h;
}

/* ================= run control ================= */
function startRun(title, items, story){
  run = {mode, title, items, i:0, results:[], exam, story};
  render();
}
function cur(){ return run.items[run.i]; }

function startScen(id){
  const sc = SCEN[id];
  startRun(sc.name, sc.steps.map(s => ({...s})), true);
}
function startTrace(id){
  let pairs = [];
  if(id === 'mix'){
    PATHS.forEach(p => p.enz.forEach((_, e) => pairs.push({p, e})));
    pairs = shuffle(pairs).slice(0,5);
  } else {
    const p = PATHS.find(x => x.id === id);
    pairs = shuffle(p.enz.map((_, e) => ({p, e}))).slice(0,5);
  }
  const items = [];
  pairs.forEach(x => {
    items.push({kind:'grid', p:x.p, e:x.e, marks:[], pile:null});
    const c = (x.p.comp || {})[x.p.enz[x.e]];
    if(c) items.push({...c});
  });
  startRun(id === 'mix' ? 'Block it, mixed' : 'Block it, ' + pairs[0].p.name, items, false);
}
function startCase(id){
  const c = id === 'rand' ? CASES[Math.floor(Math.random() * CASES.length)] : CASES.find(x => x.id === id);
  startRun(c.title, buildCase(c), false);
  run.caseId = c.id;
}
function startCrit(){
  const items = [];
  CRIT.forEach(c => {
    items.push({kind:'mc', tag:'Name the flaw', q:'What is wrong with this question?', ctx:c.exam, opts:[FLAWS[c.flaw], ...FLAWS.filter((_, i) => i !== c.flaw)], why:c.why1});
    items.push({kind:'mc', tag:'Choose the fix', q:'Which rewrite fixes it best?', ctx:c.exam, opts:[...c.fixes], why:c.why2});
  });
  startRun('Fix the question', items, false);
}

/* ================= rendering ================= */
function ticks(){
  let h = '<div class="ticks">';
  run.items.forEach((it, i) => {
    let c = 'tick';
    const r = run.results[i];
    if(i === run.i && !r) c += ' cur';
    else if(r) c += run.exam ? ' done' : (r.ok ? ' ok' : ' bad');
    h += `<div class="${c}"></div>`;
  });
  return h + '</div>';
}
function tblock(){
  const right = run.results.filter(r => r.ok).length;
  const marks = run.exam ? 'hidden until the end' : `${right} of ${run.results.length} right`;
  return `<div class="tblock"><div><span>Drill</span><b>${run.title}</b></div><div><span>Item</span><b>${run.i + 1} of ${run.items.length}</b></div><div><span>Feedback</span><b>${run.exam ? 'At the end' : 'After each'}</b></div><div><span>Score so far</span><b>${marks}</b></div></div>`;
}
function ribbon(upto, full){
  const parts = [];
  for(let i = 0; i < upto; i++){
    const it = run.items[i];
    const txt = run.exam && !full ? 'locked in' : it.chain;
    parts.push(`<span class="s"><i>${it.label}</i>${txt}</span>`);
  }
  return parts.length ? `<div class="ribbon">${parts.join('<span class="ar">›</span>')}</div>` : '';
}
function chipHTML(l){
  const d = l.v;
  const val = typeof d === 'number' ? arrow(d) : d;
  const cls = typeof d === 'number' ? (d < 0 ? 'dn' : '') : 'eq';
  return `<span class="chip ${cls}">${l.n}<b>${val}</b></span>`;
}
function caseBox(it){
  const c = it.caseRef; if(!c) return '';
  const open = run.items.indexOf(it) === 0 || it.clue;
  let h = `<details class="case" ${open ? 'open' : ''}><summary>The case</summary><div class="inner"><div class="exam">${c.vignette}</div>`;
  if(!it.clue && c.labs.length) h += '<div class="chips">' + c.labs.map(chipHTML).join('') + '</div>';
  return h + '</div></details>';
}

function render(){
  const it = cur();
  if(it.kind === 'mc') renderMC(it);
  else if(it.kind === 'multi') renderMulti(it);
  else renderGrid(it);
}

function renderMC(it){
  if(!it.order) it.order = shuffle(it.opts.map((_, i) => i));
  let h = `<div class="sheet">${ticks()}`;
  if(run.story) h += ribbon(run.i);
  h += caseBox(it);
  h += `<p class="tag">${it.tag || ''}</p>`;
  if(it.ctx) h += `<div class="exam">${it.ctx}</div>`;
  h += `<h3 class="q">${it.q}</h3>`;
  h += '<div class="opts">';
  it.order.forEach((oi, k) => {
    h += `<button class="opt" data-oi="${oi}"><span class="bub">${L(k)}</span><span class="t"><span class="tx">${it.opts[oi]}</span><span class="rs"></span></span></button>`;
  });
  h += `</div><div id="fb"></div><div class="actions" id="act"></div>${tblock()}</div>`;
  app.innerHTML = h;
}

function nextBtn(){
  const last = run.i >= run.items.length - 1;
  $('#act').innerHTML = `<button class="btn" data-act="next">${last ? 'Show results' : 'Next question'}</button>`;
  $('#act button').focus();
}

function rsDetail(it, ok, pickText){
  return `<p><b>Answer:</b> ${it.opts[0]}</p>` +
    it.order.map((oi, k) => `<p><b>${L(k)}${oi === 0 ? ' (correct)' : ''}.</b> ${it.opts[oi]}<br><small>${it.rs[oi]}</small></p>`).join('') +
    (ok ? '' : `<p><small>You picked: ${pickText}</small></p>`);
}

function pickMC(pick){
  const it = cur(); if(it.done) return;
  it.done = true;
  const ok = pick === 0;
  const q = it.ctx ? it.tag + ': ' + it.q : it.q;
  const detail = it.rs ? rsDetail(it, ok, it.opts[pick])
    : `<p><b>Answer:</b> ${it.opts[0]}</p><p>${it.why}</p>` + (ok ? '' : `<p><small>You picked: ${it.opts[pick]}</small></p>`);
  run.results.push({ok, tag:it.tag, title:q.length > 96 ? q.slice(0, 94) + '…' : q, detail});
  document.querySelectorAll('.opt').forEach(b => {
    const k = +b.dataset.oi; b.disabled = true;
    const bub = b.querySelector('.bub');
    if(run.exam){ if(k === pick) b.classList.add('sel'); }
    else {
      if(k === 0){ b.classList.add('ok'); bub.textContent = '✓'; }
      else if(k === pick){ b.classList.add('bad'); bub.textContent = '✕'; }
      if(it.rs) b.querySelector('.rs').textContent = it.rs[k];
    }
  });
  if(!run.exam){
    if(it.rs){
      $('#fb').innerHTML = ok
        ? `<div class="note"><h4>That logic holds.</h4><p>Read why each option is right or wrong above.</p></div>`
        : `<div class="note bad"><h4>Not quite.</h4><p>The answer is highlighted. Read the note under each option to see why.</p></div>`;
    } else {
      $('#fb').innerHTML = ok
        ? `<div class="note"><h4>That logic holds.</h4><p>${it.why}</p></div>`
        : `<div class="note bad"><h4>Not quite.</h4><p><b>Answer:</b> ${it.opts[0]}</p><p>${it.why}</p></div>`;
    }
  }
  nextBtn();
}

/* ---- multi (clues and select all that apply) ---- */
function renderMulti(it){
  if(!it.sel) it.sel = new Set();
  if(!it.order) it.order = it.style === 'rows' ? shuffle(it.items.map((_, i) => i)) : it.items.map((_, i) => i);
  let h = `<div class="sheet">${ticks()}${caseBox(it)}<p class="tag">${it.tag || ''}</p><h3 class="q">${it.q}</h3>`;
  if(it.style === 'chips'){
    h += '<div class="chips">' + it.order.map(i => {
      const x = it.items[i], d = x.v;
      const val = typeof d === 'number' ? arrow(d) : d;
      const cls = typeof d === 'number' ? (d < 0 ? 'dn' : '') : 'eq';
      return `<button class="chip pick ${cls}" data-m="${i}">${x.t}<b>${val}</b></button>`;
    }).join('') + '</div>';
  } else {
    h += '<div class="opts">' + it.order.map((i, k) =>
      `<button class="opt pick" data-m="${i}"><span class="bub">${L(k)}</span><span class="t"><span class="tx">${it.items[i].t}</span><span class="rs"></span></span></button>`).join('') + '</div>';
  }
  h += `<div class="actions"><button class="btn" data-act="checkm" id="chk">${it.clue ? 'Check my clues' : 'Check my answers'}</button><span class="warn" id="warn"></span></div><div id="fb"></div><div class="actions" id="act"></div>${tblock()}</div>`;
  app.innerHTML = h;
}
function toggleMulti(i){
  const it = cur(); if(it.kind !== 'multi' || it.done) return;
  if(it.sel.has(i)) it.sel.delete(i); else it.sel.add(i);
  document.querySelectorAll('.pick').forEach(b => {
    const on = it.sel.has(+b.dataset.m);
    b.classList.toggle('on', on);
    if(b.classList.contains('opt')) b.classList.toggle('sel', on);
  });
}
function checkMulti(){
  const it = cur(); if(it.done) return;
  if(it.sel.size === 0){ $('#warn').textContent = 'Pick at least one first.'; return; }
  it.done = true;
  const keys = it.items.map((x, i) => x.key ? i : -1).filter(i => i >= 0);
  const missed = keys.filter(i => !it.sel.has(i));
  const extras = [...it.sel].filter(i => !it.items[i].key);
  const ok = missed.length === 0 && extras.length <= (it.allowExtra || 0);
  const lines = it.order.map(i => {
    const x = it.items[i];
    const tag = x.key ? (it.sel.has(i) ? 'Key clue, you got it' : 'Key clue, you missed it') : (it.sel.has(i) ? 'Not a key clue, you picked it' : 'Not a key clue');
    return `<p><b>${x.t}</b> (${tag})<br><small>${x.why}</small></p>`;
  }).join('');
  const q = it.clue ? 'Circle the clues' : it.q;
  run.results.push({ok, tag:it.tag, title:q.length > 96 ? q.slice(0, 94) + '…' : q, detail:lines});
  $('#chk').style.display = 'none'; $('#warn').textContent = '';
  document.querySelectorAll('.pick').forEach(b => {
    const i = +b.dataset.m, x = it.items[i], chosen = it.sel.has(i);
    b.disabled = true; b.classList.remove('on', 'sel');
    if(run.exam){ if(chosen) b.classList.add(b.classList.contains('opt') ? 'sel' : 'on'); return; }
    const bub = b.querySelector('.bub');
    if(x.key && chosen){ b.classList.add('ok'); if(bub) bub.textContent = '✓'; }
    else if(x.key){ b.classList.add('miss'); if(bub) bub.textContent = '!'; }
    else if(chosen){ b.classList.add('bad'); if(bub) bub.textContent = '✕'; }
    const rs = b.querySelector('.rs'); if(rs) rs.textContent = x.why;
  });
  if(!run.exam){
    const head = ok ? 'That logic holds.' : (missed.length ? 'You missed a key finding.' : 'Close. You circled too much.');
    const body = it.clue ? '<p>Key clues are outlined in green. A dashed yellow outline is one you missed. Red is not a key clue.</p>' : '<p>Read the note under each option.</p>';
    $('#fb').innerHTML = `<div class="note ${ok ? '' : 'bad'}"><h4>${head}</h4>${body}${it.clue ? lines : ''}</div>`;
  }
  nextBtn();
}

/* ---- grid ---- */
function expectedFor(p, e){
  const rows = p.mets.map((m, i) => ({name:m, dir:i <= e ? 1 : -1, kind:'met'}));
  const ex = (p.extraAll || []).concat((p.extras && p.extras[p.enz[e]]) || []);
  ex.forEach(([n, d]) => rows.push({name:n, dir:d, kind:'extra'}));
  return rows;
}
function renderGrid(it){
  const {p, e} = it;
  it.rows = expectedFor(p, e);
  const n = p.mets.length;
  let h = `<div class="sheet">${ticks()}<p class="tag">${p.name}</p>`;
  h += `<h3 class="q">${p.enz[e]} is blocked. Click each box to mark it: ↑ piles up, ↓ runs short.</h3><div class="chain">`;
  p.mets.forEach((m, i) => {
    h += `<div class="node" data-r="${i}"><span>${m}</span><span class="mk">?</span></div>`;
    if(i < p.enz.length){
      const b = i === e;
      h += `<div class="link ${b ? 'blocked' : ''}"><span>${p.enz[i]}</span><i></i>${b ? '<em class="stamp">✕ blocked</em>' : ''}</div>`;
    }
  });
  h += '</div>';
  const ex = it.rows.slice(n);
  if(ex.length){
    h += '<p class="sub2">Also track these side effects</p><div class="extras">';
    ex.forEach((r, j) => h += `<div class="node" data-r="${n + j}"><span>${r.name}</span><span class="mk">?</span></div>`);
    h += '</div>';
  }
  if(e >= 1){
    h += '<p class="sub2">Which one piles up the most?</p><div class="extras">';
    for(let i = 0; i <= e; i++) h += `<button class="pile" data-pile="${i}">${p.mets[i]}</button>`;
    h += '</div>';
  }
  h += `<div class="actions"><button class="btn" data-act="check" id="chk">Check my marks</button><span class="warn" id="warn"></span></div><div id="fb"></div><div class="actions" id="act"></div>${tblock()}</div>`;
  app.innerHTML = h;
}
function paintGrid(it, reveal){
  document.querySelectorAll('.node').forEach(nd => {
    const r = +nd.dataset.r, m = it.marks[r], row = it.rows[r];
    nd.classList.toggle('up', m === 1);
    nd.classList.toggle('dn', m === -1);
    const good = m === row.dir;
    const mk = nd.querySelector('.mk');
    if(reveal){
      nd.classList.add('locked', good ? 'ok' : 'bad');
      mk.innerHTML = arrow(m) + (good ? '' : `<small>key ${arrow(row.dir)}</small>`);
    } else {
      mk.textContent = m === undefined ? '?' : arrow(m);
      if(it.done) nd.classList.add('locked');
    }
  });
  document.querySelectorAll('.pile').forEach(b => {
    const i = +b.dataset.pile;
    b.classList.toggle('on', it.pile === i && !reveal);
    if(reveal){
      b.disabled = true;
      if(i === it.e) b.classList.add('ok'); else if(i === it.pile) b.classList.add('bad');
    }
  });
}
function cycleNode(r){
  const it = cur(); if(it.kind !== 'grid' || it.done) return;
  const m = it.marks[r];
  it.marks[r] = m === undefined ? 1 : m === 1 ? -1 : undefined;
  paintGrid(it, false);
}
function checkGrid(){
  const it = cur(); if(it.done) return;
  const missing = it.rows.some((_, i) => it.marks[i] === undefined) || (it.e >= 1 && it.pile == null);
  if(missing){ $('#warn').textContent = 'Mark every box' + (it.e >= 1 ? ' and pick the biggest pile-up' : '') + ' first.'; return; }
  it.done = true;
  const p = it.p, e = it.e;
  let wrong = 0; const lines = [];
  it.rows.forEach((r, i) => {
    const good = it.marks[i] === r.dir; if(!good) wrong++;
    lines.push(`${r.name}: you ${arrow(it.marks[i])}, key ${arrow(r.dir)}${good ? '' : ' (missed)'}`);
  });
  const pileOk = it.e < 1 || it.pile === e;
  const ok = wrong === 0 && pileOk;
  const sub = p.mets[e], prod = p.mets[e + 1];
  let why = `<p><b>${p.enz[e]}</b> is blocked. Everything up to <b>${sub}</b> backs up (↑). Everything after the block, starting with <b>${prod}</b>, runs short (↓). The biggest pile-up sits right at the block: <b>${sub}</b>.</p>`;
  const exs = it.rows.filter(r => r.kind === 'extra');
  if(exs.length) why += `<p>Side effects: ${exs.map(r => r.name + ' ' + arrow(r.dir)).join(', ')}.</p>`;
  const note = (p.notes || {})[p.enz[e]]; if(note) why += `<p>${note}</p>`;
  if(p.foot) why += `<p><small>${p.foot}</small></p>`;
  const detail = why + `<p><small>${lines.join('<br>')}${it.e >= 1 ? '<br>Biggest pile-up: you picked ' + p.mets[it.pile] + (pileOk ? '' : ' (missed)') : ''}</small></p>`;
  run.results.push({ok, tag:p.name, title:`${p.enz[e]} blocked in ${p.name}`, detail});
  $('#chk').style.display = 'none'; $('#warn').textContent = '';
  paintGrid(it, !run.exam);
  if(run.exam) document.querySelectorAll('.node').forEach(n => n.classList.add('locked'));
  if(!run.exam){
    $('#fb').innerHTML = ok
      ? `<div class="note"><h4>Every mark holds.</h4>${why}</div>`
      : `<div class="note bad"><h4>${wrong} box${wrong === 1 ? '' : 'es'} off${pileOk ? '' : ', and the biggest pile-up is elsewhere'}.</h4>${why}</div>`;
  }
  nextBtn();
}

/* ---- finish ---- */
function finish(){
  const total = run.results.length, right = run.results.filter(r => r.ok).length;
  const missed = {};
  run.results.forEach(r => { if(!r.ok) missed[r.tag] = (missed[r.tag] || 0) + 1; });
  let h = `<div class="sheet"><p class="tag">${run.title}</p><div class="score">${right}<small> of ${total}</small></div>`;
  h += `<p class="lede">${right === total ? 'Clean sheet. Try a different drill, or switch feedback to "At the end" to test yourself like an exam.' : right / total >= .7 ? 'Solid. Open the missed items below and trace where the logic slipped.' : 'Good first pass. Read each miss below, then run another round.'}</p>`;
  const keys = Object.keys(missed);
  if(keys.length) h += `<div class="weak"><b>Where the misses landed</b><p style="margin:6px 0 0">${keys.map(k => `${k} (${missed[k]})`).join(', ')}</p></div>`;
  if(run.story) h += `<p class="sub2">The full chain</p>${ribbon(run.items.length, true)}`;
  run.results.forEach(r => {
    h += `<details class="r" ${(!r.ok || run.exam) ? 'open' : ''}><summary><span class="m ${r.ok ? 'ok' : 'bad'}">${r.ok ? '✓' : '✕'}</span><span>${r.title}</span></summary><div class="body">${r.detail}</div></details>`;
  });
  h += `<div class="actions"><button class="btn" data-act="again">Run another round</button><button class="btn ghost" data-act="menu">Back to menu</button></div></div>`;
  app.innerHTML = h;
  window.scrollTo({top:0});
}

/* ================= events ================= */
app.addEventListener('click', e => {
  const t = e.target;
  const a = t.closest('[data-act]');
  if(a){
    const act = a.dataset.act;
    if(act === 'scen') startScen(a.dataset.id);
    else if(act === 'trace') startTrace(a.dataset.id);
    else if(act === 'case') startCase(a.dataset.id);
    else if(act === 'crit') startCrit();
    else if(act === 'check') checkGrid();
    else if(act === 'checkm') checkMulti();
    else if(act === 'menu'){ run = null; menu(); }
    else if(act === 'again'){
      if(mode === 'cascade'){ const id = Object.keys(SCEN).find(k => SCEN[k].name === run.title); startScen(id); }
      else if(mode === 'trace'){ const p = PATHS.find(x => run.title.endsWith(x.name)); startTrace(p ? p.id : 'mix'); }
      else if(mode === 'detect') startCase('rand');
      else startCrit();
    }
    else if(act === 'next'){ run.i++; if(run.i >= run.items.length) finish(); else { render(); window.scrollTo({top:0}); } }
    return;
  }
  const pk = t.closest('[data-m]');
  if(pk && !pk.disabled){ toggleMulti(+pk.dataset.m); return; }
  const o = t.closest('.opt');
  if(o && !o.disabled && o.dataset.oi !== undefined){ pickMC(+o.dataset.oi); return; }
  const nd = t.closest('.node');
  if(nd){ cycleNode(+nd.dataset.r); return; }
  const pl = t.closest('.pile');
  if(pl && !pl.disabled){ const it = cur(); if(it.done) return; it.pile = +pl.dataset.pile; paintGrid(it, false); }
});

menu();
</script>
</body>
</html>
