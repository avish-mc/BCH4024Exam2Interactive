/* ================= STATE ================= */
let currentMode = 'cascade';
let currentScenario = null;
let currentQuestionIdx = 0;
let currentResponse = null;
let showReason = false;
let cachedShuffledCascade = null;
let cachedShuffledDetect = null;

/* ================= SHUFFLE HELPERS ================= */
function createShuffledOptions(correctAnswer, wrongAnswers) {
  const options = [correctAnswer, ...wrongAnswers];
  const shuffled = options.map((o, i) => ({ opt: o, correct: i === 0 }));
  shuffled.sort(() => Math.random() - 0.5);
  return shuffled;
}

/* ================= RENDER ================= */
function renderApp() {
  const app = document.getElementById('app');

  if (currentMode === 'cascade') {
    renderCascade();
  } else if (currentMode === 'detect') {
    renderDetect();
  }
}

function renderCascade() {
  const app = document.getElementById('app');

  if (!document.querySelector('[data-mode="cascade"]').classList.contains('active')) {
    document.querySelectorAll('.nav-card').forEach(c => c.classList.remove('active'));
    document.querySelector('[data-mode="cascade"]').classList.add('active');
  }

  const scenarios = Object.keys(SCEN);

  if (currentScenario === null) {
    app.innerHTML = `
      <div class="intro-text">
        <h2>Cascade: Step-by-Step Pathway Logic</h2>
        <p>Choose a metabolic scenario and follow the hormone signal through the cell. Each question builds on the last, testing your understanding of how one change triggers the next.</p>
      </div>
      <div class="nav-grid">
        ${scenarios.map(key => {
          const s = SCEN[key];
          return `
            <div class="nav-card" onclick="startCascade('${key}')">
              <h3>${s.name}</h3>
              <p>${s.steps.length} questions</p>
            </div>
          `;
        }).join('')}
      </div>
    `;
    return;
  }

  const scenario = SCEN[currentScenario];
  const step = scenario.steps[currentQuestionIdx];
  const progress = currentQuestionIdx + 1;
  const total = scenario.steps.length;

  // Create shuffled options ONLY if we haven't shuffled this question yet
  if (!cachedShuffledCascade) {
    cachedShuffledCascade = createShuffledOptions(step.a, step.w);
  }

  const shuffled = cachedShuffledCascade;

  let html = `
    <div class="progress">
      <span>${progress} / ${total}</span>
      <div class="progress-bar">
        <div class="progress-bar-fill" style="width: ${progress/total*100}%"></div>
      </div>
    </div>
    <div class="question-card">
      <h2 style="margin-top: 0">${scenario.name}</h2>
      <div class="q-text">${step.q}</div>
      <div class="options">
  `;

  shuffled.forEach((item, i) => {
    const isSelected = currentResponse === i;
    const isCorrect = item.correct;
    let className = 'option';
    if (isSelected && isCorrect) className += ' correct';
    if (isSelected && !isCorrect) className += ' incorrect';
    if (isSelected) className += ' selected';

    html += `
      <div class="${className}" onclick="selectOption('cascade', ${i}, ${isCorrect})">
        <div class="option-letter">${String.fromCharCode(65 + i)}</div>
        <div class="option-text">
          <div class="txt">${item.opt}</div>
          ${isSelected && showReason ? `<div class="option-reason">${step.why}</div>` : ''}
        </div>
      </div>
    `;
  });

  html += `</div>`;

  if (currentResponse !== null) {
    html += `
      <div class="actions">
        ${currentQuestionIdx < scenario.steps.length - 1 ? `<button class="btn" onclick="nextQuestion('cascade')">Next</button>` : `<button class="btn" onclick="backToScenarios()">Back to scenarios</button>`}
        ${!showReason ? `<button class="btn ghost" onclick="toggleReason()">Show explanation</button>` : ''}
      </div>
    `;
  }

  html += `</div>`;
  app.innerHTML = html;
}

function renderDetect() {
  const app = document.getElementById('app');

  if (!document.querySelector('[data-mode="detect"]').classList.contains('active')) {
    document.querySelectorAll('.nav-card').forEach(c => c.classList.remove('active'));
    document.querySelector('[data-mode="detect"]').classList.add('active');
  }

  const caseItem = CASES[currentQuestionIdx % CASES.length];
  const progress = currentQuestionIdx + 1;
  const total = CASES.length;

  // Create shuffled options ONLY if we haven't shuffled this question yet
  if (!cachedShuffledDetect) {
    cachedShuffledDetect = createShuffledOptions(caseItem.opts[0], caseItem.opts.slice(1));
  }

  const shuffled = cachedShuffledDetect;

  let html = `
    <div class="progress">
      <span>${progress} / ${total}</span>
      <div class="progress-bar">
        <div class="progress-bar-fill" style="width: ${progress/total*100}%"></div>
      </div>
    </div>
    <div class="question-card">
      <h2 style="margin-top: 0">${caseItem.name}</h2>
      <div class="q-context"><strong>Patient:</strong> ${caseItem.blurb}</div>
      <div class="q-labs">
        <strong>Lab findings:</strong><br>
        ${caseItem.labs.map(l => '• ' + l).join('<br>')}
      </div>
      <div class="q-text">${caseItem.q}</div>
      <div class="options">
  `;

  shuffled.forEach((item, i) => {
    const isSelected = currentResponse === i;
    const isCorrect = item.correct;
    let className = 'option';
    if (isSelected && isCorrect) className += ' correct';
    if (isSelected && !isCorrect) className += ' incorrect';
    if (isSelected) className += ' selected';

    html += `
      <div class="${className}" onclick="selectOption('detect', ${i}, ${isCorrect})">
        <div class="option-letter">${String.fromCharCode(65 + i)}</div>
        <div class="option-text">
          <div class="txt">${item.opt}</div>
          ${isSelected && showReason ? `<div class="option-reason">${caseItem.why}</div>` : ''}
        </div>
      </div>
    `;
  });

  html += `</div>`;

  if (currentResponse !== null) {
    html += `
      <div class="actions">
        ${currentQuestionIdx < CASES.length - 1 ? `<button class="btn" onclick="nextQuestion('detect')">Next</button>` : `<button class="btn" onclick="resetMode('detect')">Restart</button>`}
        ${!showReason ? `<button class="btn ghost" onclick="toggleReason()">Show explanation</button>` : ''}
      </div>
    `;
  }

  html += `</div>`;
  app.innerHTML = html;
}


/* ================= INTERACTION ================= */
function startCascade(scenario) {
  currentScenario = scenario;
  currentQuestionIdx = 0;
  currentResponse = null;
  showReason = false;
  cachedShuffledCascade = null;
  cachedShuffledDetect = null;
  renderCascade();
}

function selectOption(mode, idx, isCorrect) {
  currentResponse = idx;
  showReason = true;
  renderApp();
}

function nextQuestion(mode) {
  currentQuestionIdx++;
  currentResponse = null;
  showReason = false;
  cachedShuffledCascade = null;
  cachedShuffledDetect = null;
  renderApp();
}

function toggleReason() {
  showReason = !showReason;
  renderApp();
}

function backToScenarios() {
  currentScenario = null;
  currentQuestionIdx = 0;
  currentResponse = null;
  showReason = false;
  cachedShuffledCascade = null;
  cachedShuffledDetect = null;
  renderCascade();
}

function resetMode(mode) {
  currentQuestionIdx = 0;
  currentResponse = null;
  showReason = false;
  cachedShuffledCascade = null;
  cachedShuffledDetect = null;
  if (mode === 'cascade') {
    currentScenario = null;
  }
  renderApp();
}

// Nav clicks
document.querySelectorAll('.nav-card').forEach(card => {
  card.addEventListener('click', function() {
    currentMode = this.dataset.mode;
    currentQuestionIdx = 0;
    currentResponse = null;
    showReason = false;
    cachedShuffledCascade = null;
    cachedShuffledDetect = null;
    if (currentMode === 'cascade') {
      currentScenario = null;
    }
    renderApp();
  });
});

// Initial render
renderApp();
</script>
