<style>
* { box-sizing: border-box; }
:root {
  --bg: #f8f9fa;
  --card-bg: #ffffff;
  --border: #e5e7eb;
  --text: #1f2937;
  --text-dim: #6b7280;
  --accent: #3b82f6;
  --accent-light: #eff6ff;
  --correct: #10b981;
  --incorrect: #ef4444;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f172a;
    --card-bg: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --text-dim: #cbd5e1;
    --accent: #60a5fa;
    --accent-light: #0c4a6e;
    --correct: #10b981;
    --incorrect: #ef4444;
  }
}

html, body { margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background-color: var(--bg);
  color: var(--text);
  line-height: 1.6;
  font-size: 16px;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 24px;
}

header {
  margin-bottom: 32px;
  text-align: center;
}

header h1 {
  margin: 0 0 8px;
  font-size: 28px;
  font-weight: 700;
}

header p {
  margin: 0;
  color: var(--text-dim);
  font-size: 15px;
}

.nav-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}

.nav-card {
  background: var(--card-bg);
  border: 2px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  color: inherit;
}

.nav-card:hover {
  border-color: var(--accent);
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.1);
}

.nav-card.active {
  background: var(--accent-light);
  border-color: var(--accent);
}

.nav-card h3 {
  margin: 0 0 8px;
  font-size: 18px;
  font-weight: 600;
}

.nav-card p {
  margin: 0;
  font-size: 14px;
  color: var(--text-dim);
}

.content {
  display: none;
}

.content.active {
  display: block;
}

.question-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 24px;
  margin-bottom: 24px;
}

.q-text {
  font-size: 18px;
  font-weight: 600;
  margin: 0 0 16px;
  color: var(--text);
}

.q-context {
  background: var(--accent-light);
  border-left: 4px solid var(--accent);
  padding: 12px 16px;
  margin-bottom: 16px;
  font-size: 15px;
  border-radius: 4px;
}

.q-labs {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 16px;
  margin: 16px 0;
  border-radius: 6px;
  font-family: 'Inter', monospace;
  font-size: 14px;
  line-height: 1.8;
}

.q-labs strong {
  color: var(--accent);
}

.chain-visual {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 16px 0;
  flex-wrap: wrap;
}

.chain-node {
  background: var(--bg);
  border: 2px solid var(--border);
  padding: 12px 16px;
  border-radius: 6px;
  font-weight: 500;
  font-size: 14px;
  text-align: center;
  min-width: 100px;
}

.chain-node.up { border-color: var(--accent); color: var(--accent); }
.chain-node.dn { border-color: var(--incorrect); color: var(--incorrect); }

.chain-arrow { color: var(--text-dim); font-weight: 600; }

.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 20px;
}

.option {
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: 6px;
  padding: 14px 16px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: left;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.option:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--accent-light);
}

.option-letter {
  flex: 0 0 24px;
  height: 24px;
  border: 2px solid var(--border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 13px;
  margin-top: 2px;
}

.option.selected .option-letter {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.option.correct {
  border-color: var(--correct);
  background: rgba(16, 185, 129, 0.05);
}

.option.correct .option-letter {
  background: var(--correct);
  color: white;
  border-color: var(--correct);
}

.option.incorrect {
  border-color: var(--incorrect);
  background: rgba(239, 68, 68, 0.05);
}

.option.incorrect .option-letter {
  background: var(--incorrect);
  color: white;
  border-color: var(--incorrect);
}

.option-text { flex: 1; }
.option-text .txt { font-weight: 500; }
.option.incorrect .txt { text-decoration: line-through; color: var(--text-dim); }

.option-reason {
  font-size: 14px;
  color: var(--text-dim);
  margin-top: 8px;
  line-height: 1.5;
}

.option.correct .option-reason { color: var(--correct); }
.option.incorrect .option-reason { color: var(--incorrect); }

.feedback-toggle {
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
}

.feedback-btn {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
}

.feedback-btn.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.progress {
  display: flex;
  gap: 6px;
  align-items: center;
  margin-bottom: 20px;
  font-size: 14px;
  color: var(--text-dim);
}

.progress-bar {
  flex: 1;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: var(--accent);
  width: 0%;
  transition: width 0.3s;
}

.actions {
  display: flex;
  gap: 12px;
  margin-top: 24px;
  flex-wrap: wrap;
}

.btn {
  background: var(--accent);
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
}

.btn:hover { filter: brightness(1.1); }

.btn.ghost {
  background: var(--bg);
  color: var(--accent);
  border: 1px solid var(--accent);
}

.intro-text {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 24px;
  margin-bottom: 24px;
  color: var(--text-dim);
  line-height: 1.8;
}

.intro-text h2 {
  margin: 0 0 12px;
  font-size: 18px;
  color: var(--text);
}

footer {
  margin-top: 48px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
  text-align: center;
  color: var(--text-dim);
  font-size: 14px;
}

        w: ['NADH is quickly converted to ATP to compensate', 'NADH is exported to the cytosol for use elsewhere', 'The TCA cycle speeds up to bypass Complex I'],
        why: 'Complex I is the entry point for NADH electrons. Without it, NADH piles up and NAD+ becomes scarce. The TCA cycle stalls because isocitrate dehydrogenase needs NAD+.'
      },
      {
        q: 'As NAD+ becomes scarce, what happens to glycolysis in the cytosol?',
        a: 'Glyceraldehyde-3-phosphate dehydrogenase cannot oxidize G3P to 1,3-BPG because NAD+ is needed for this step',

      },
      {
        q: 'To keep some ATP production going, the cell shunts pyruvate to lactate via lactate dehydrogenase. Why does this work?',
        a: 'Lactate dehydrogenase converts pyruvate back to lactate, regenerating NAD+ so glycolysis can keep running',
        w: ['Lactate directly generates ATP via a specialized pathway', 'Lactate is exported and triggers more glucose uptake', 'Lactate replaces NAD+ as an electron carrier'],
        why: 'LDH reduces pyruvate to lactate, oxidizing NADH back to NAD+. This regenerates the NAD+ that glycolysis needs, even though no ATP is gained from the lactate itself. It is a NAD+ rescue, not an energy source.'

        q: 'What would a blood test show in this patient?',

        q: 'If the Complex I defect is severe enough, how would the proton gradient across the inner mitochondrial membrane be affected?',

      }

      'Lactate dehydrogenase is overactive; pyruvate is shunted away from oxidation'
    ],
    why: 'The malate-aspartate shuttle transfers reducing equivalents from cytosolic NADH into the mitochondria (NADH cannot cross the inner membrane directly). A defect means cytosolic NADH accumulates, NAD+ is depleted, and glycolysis stalls. Pyruvate made from amino acids accumulates and forms alanine (which is exported). The ETC works fine, but there is no NADH to feed it because the shuttle is broken. Exercise is when demand is highest, so symptoms appear then.'
  },
  {
    name: 'Isocitrate dehydrogenase inhibition (oncogenic mutation)',
    blurb: 'A 62-year-old man with a brain glioma has elevated 2-hydroxyglutarate (2-HG) levels. The mutation is in IDH1, an isocitrate dehydrogenase isoform found in the cytosol.',
    labs: [
      '2-Hydroxyglutarate (2-HG): markedly elevated (normal <1 mmol/L)',
      'Citrate: elevated',
      'Alpha-ketoglutarate: normal to low',
      'Lactate: elevated',
      'NADPH: elevated (normally consumed in biosynthesis)',
      'Acetyl-CoA: normal'
    ],
    q: 'How does an IDH1 mutation cause elevated 2-HG and altered metabolism?',
    opts: [
      'Mutant IDH1 catalyzes the reduction of α-ketoglutarate to 2-HG instead of oxidizing isocitrate; this blocks the TCA cycle and depletes NAD+',
      'The IDH1 mutation causes overproduction of isocitrate in the mitochondria',
      '2-HG is made by normal IDH3, but the mutant IDH1 prevents its degradation',
      'Lactate dehydrogenase is overactive and produces 2-HG from lactate',
      'The mutation occurs in the mitochondrial isocitrate dehydrogenase (IDH2), not the cytosolic IDH1'
    ],
    why: 'Mutant IDH1 has a "gain-of-function" that converts α-ketoglutarate to 2-HG (an oncometabolite). This blocks the normal TCA cycle by consuming its intermediate and depleting NAD+. Cancer cells accumulate 2-HG, which blocks demethylases and causes epigenetic changes that drive tumor growth. This is a sophisticated exam question testing both enzyme catalysis and understanding how a mutation changes enzymatic function.'
  },
  {
    name: 'Fanconi renotubular syndrome (secondary to alcohol)',
    blurb: 'A 52-year-old man with chronic alcohol use disorder presents with polyuria, polydipsia, and muscle weakness. His kidneys are damaged but structures are normal on ultrasound.',
    labs: [
      'Blood pH: 7.28 (acidemia)',
      'Serum bicarbonate: 14 mEq/L (low)',
      'Serum potassium: 2.8 mEq/L (low)',
      'Serum phosphate: 1.5 mg/dL (low)',
      'Urine glucose: present (but blood glucose is normal)',
      'Urine amino acids: elevated (including glycine, alanine)'
    ],
    q: 'What is the primary defect causing loss of glucose and amino acids in urine?',
    opts: [
      'Proximal tubule cells have impaired ATP-dependent reabsorption (Na⁺-glucose cotransport and amino acid cotransport require ATP and fail)',
      'Insulin deficiency causes hyperglycemia and glucosuria (spilling over the renal threshold)',
      'Glomerular filtration rate is elevated, forcing more filtrate through the nephron',
      'Genetic mutations in GLUT1 on the glomerular basement membrane',
      'Alcohol directly damages aquaporins, preventing water reabsorption'
    ],
    why: 'Chronic alcohol damages mitochondria in proximal tubule cells, depleting ATP. Secondary active transporters (SGLT2 for glucose, amino acid cotransporters) require ATP to reabsorb filtered glucose and amino acids against concentration gradients. Without ATP, these valuable substrates are lost in urine. Additionally, renal tubular acidosis develops because H⁺ secretion (also ATP-dependent) is impaired. This is not a primary enzyme or transport protein defect, but a consequence of energy (ATP) depletion.'
  }
];


/* ================= STATE ================= */
let currentMode = 'cascade';
let currentScenario = 'fed';
let currentQuestionIdx = 0;
let currentResponse = null;
let showReason = false;

/* ================= RENDER ================= */
function renderApp() {
  const app = document.getElementById('app');

  if (currentMode === 'cascade') {
    renderCascade();
  } else if (currentMode === 'detect') {
    renderDetect();
  }
}

function renderCascade() {
  const app = document.getElementById('app');

  if (!document.querySelector('[data-mode="cascade"]').classList.contains('active')) {
    document.querySelectorAll('.nav-card').forEach(c => c.classList.remove('active'));
    document.querySelector('[data-mode="cascade"]').classList.add('active');
  }

  const scenarios = Object.keys(SCEN);

  if (currentScenario === null) {
    app.innerHTML = `
      <div class="intro-text">
        <h2>Cascade: Step-by-Step Pathway Logic</h2>
        <p>Choose a metabolic scenario and follow the hormone signal through the cell. Each question builds on the last, testing your understanding of how one change triggers the next.</p>
      </div>
      <div class="nav-grid">
        ${scenarios.map(key => {
          const s = SCEN[key];
          return `
            <div class="nav-card" onclick="startCascade('${key}')">
              <h3>${s.name}</h3>
              <p>${s.steps.length} questions</p>
            </div>
          `;
        }).join('')}
      </div>
    `;
    return;
  }

  const scenario = SCEN[currentScenario];
  const step = scenario.steps[currentQuestionIdx];
  const progress = currentQuestionIdx + 1;
  const total = scenario.steps.length;

  let html = `
    <div class="progress">
      <span>${progress} / ${total}</span>
      <div class="progress-bar">
        <div class="progress-bar-fill" style="width: ${progress/total*100}%"></div>
      </div>
    </div>
    <div class="question-card">
      <h2 style="margin-top: 0">${scenario.name}</h2>
      <div class="q-text">${step.q}</div>
      <div class="options">
  `;

  const options = [step.a, ...step.w];
  const shuffled = options.map((o, i) => ({ opt: o, correct: i === 0 }));
  shuffled.sort(() => Math.random() - 0.5);

  shuffled.forEach((item, i) => {
    const isSelected = currentResponse === i;
    const isCorrect = item.correct;
    let className = 'option';
    if (isSelected && isCorrect) className += ' correct';
    if (isSelected && !isCorrect) className += ' incorrect';
    if (isSelected) className += ' selected';

    html += `
      <div class="${className}" onclick="selectOption('cascade', ${i}, ${isCorrect})">
        <div class="option-letter">${String.fromCharCode(65 + i)}</div>
        <div class="option-text">
          <div class="txt">${item.opt}</div>
          ${isSelected && showReason ? `<div class="option-reason">${step.why}</div>` : ''}
        </div>
      </div>
    `;
  });

  html += `</div>`;

  if (currentResponse !== null) {
    html += `
      <div class="actions">
        ${currentQuestionIdx < scenario.steps.length - 1 ? `<button class="btn" onclick="nextQuestion('cascade')">Next</button>` : `<button class="btn" onclick="backToScenarios()">Back to scenarios</button>`}
        ${!showReason ? `<button class="btn ghost" onclick="toggleReason()">Show explanation</button>` : ''}
      </div>
    `;
  }

  html += `</div>`;
  app.innerHTML = html;
}

function renderDetect() {
  const app = document.getElementById('app');

  if (!document.querySelector('[data-mode="detect"]').classList.contains('active')) {
    document.querySelectorAll('.nav-card').forEach(c => c.classList.remove('active'));
    document.querySelector('[data-mode="detect"]').classList.add('active');
  }

  const caseItem = CASES[currentQuestionIdx % CASES.length];
  const progress = currentQuestionIdx + 1;
  const total = CASES.length;

  let html = `
    <div class="progress">
      <span>${progress} / ${total}</span>
      <div class="progress-bar">
        <div class="progress-bar-fill" style="width: ${progress/total*100}%"></div>
      </div>
    </div>
    <div class="question-card">
      <h2 style="margin-top: 0">${caseItem.name}</h2>
      <div class="q-context"><strong>Patient:</strong> ${caseItem.blurb}</div>
      <div class="q-labs">
        <strong>Lab findings:</strong><br>
        ${caseItem.labs.map(l => '• ' + l).join('<br>')}
      </div>
      <div class="q-text">${caseItem.q}</div>
      <div class="options">
  `;

  const options = caseItem.opts;
  const shuffled = options.map((o, i) => ({ opt: o, correct: i === 0 }));
  shuffled.sort(() => Math.random() - 0.5);

  shuffled.forEach((item, i) => {
    const isSelected = currentResponse === i;
    const isCorrect = item.correct;
    let className = 'option';
    if (isSelected && isCorrect) className += ' correct';
    if (isSelected && !isCorrect) className += ' incorrect';
    if (isSelected) className += ' selected';

    html += `
      <div class="${className}" onclick="selectOption('detect', ${i}, ${isCorrect})">
        <div class="option-letter">${String.fromCharCode(65 + i)}</div>
        <div class="option-text">
          <div class="txt">${item.opt}</div>
          ${isSelected && showReason ? `<div class="option-reason">${caseItem.why}</div>` : ''}
        </div>
      </div>
    `;
  });

  html += `</div>`;

  if (currentResponse !== null) {
    html += `
      <div class="actions">
        ${currentQuestionIdx < CASES.length - 1 ? `<button class="btn" onclick="nextQuestion('detect')">Next</button>` : `<button class="btn" onclick="resetMode('detect')">Restart</button>`}
        ${!showReason ? `<button class="btn ghost" onclick="toggleReason()">Show explanation</button>` : ''}
      </div>
    `;
  }

  html += `</div>`;
  app.innerHTML = html;
}


/* ================= INTERACTION ================= */
function startCascade(scenario) {
  currentScenario = scenario;
  currentQuestionIdx = 0;
  currentResponse = null;
  showReason = false;
  renderCascade();
}

function selectOption(mode, idx, isCorrect) {
  currentResponse = idx;
  showReason = true;
  renderApp();
}

function nextQuestion(mode) {
  currentQuestionIdx++;
  currentResponse = null;
  showReason = false;
  renderApp();
}

function toggleReason() {
  showReason = !showReason;
  renderApp();
}

function backToScenarios() {
  currentScenario = null;
  currentQuestionIdx = 0;
  currentResponse = null;
  showReason = false;
  renderCascade();
}

function resetMode(mode) {
  currentQuestionIdx = 0;
  currentResponse = null;
  showReason = false;
  if (mode === 'cascade') {
    currentScenario = null;
  }
  renderApp();
}

// Nav clicks
document.querySelectorAll('.nav-card').forEach(card => {
  card.addEventListener('click', function() {
    currentMode = this.dataset.mode;
    currentQuestionIdx = 0;
    currentResponse = null;
    showReason = false;
    if (currentMode === 'cascade') {
      currentScenario = null;
    }
    renderApp();
  });
});

// Initial render
renderApp();
</script>

</body>
</html>
